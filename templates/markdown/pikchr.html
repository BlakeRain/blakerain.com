<figure class="pikchr">
  <picture>
    <source media="(prefers-color-scheme: dark)" srcset="{{ dark_url }}">
    <source media="(prefers-color-scheme: light)" srcset="{{ light_url }}">
    <img src="{{ light_url }}" alt="{% if attributes and attributes.title is string %}{{ attributes.title }}{% endif %}" width="{{ width }}" height="{{ height }}">
  </picture>
  {% if attributes and attributes.title is string %}<figcaption>{{ attributes.title }}</figcaption>{% endif %}
</figure>
