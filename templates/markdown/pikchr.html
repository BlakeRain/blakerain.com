<figure class="pikchr">
  <div class="light" style="width: {{ width }}px; height: {{ height }}px">
    {{ light_image | safe }}
  </div>
  <div class="dark" style="width: {{ width }}px; height: {{ height }}px">
    {{ dark_image | safe }}
  </div>
  {% if attributes and attributes.title is string %}<figcaption>{{ attributes.title }}</figcaption>{% endif %}
</figure>
