name: deploy

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  deploy-site:
    runs-on: docker
    steps:
      - name: Install Dependencies
        run: |
          apt-get update -y
          apt-get install -y build-essential curl jq yq

      - name: Checkout the Repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: https://git.blakerain.com/actions/setup-rust-toolchain@forgejo
        with:
          toolchain: stable
          components: clippy

      - name: Build the site
        run: make release

      - name: Check typos
        uses: https://github.com/crate-ci/typos@master

      - name: Deploy the site
        env:
          BUNNY_STORAGE_HOST: ${{ secrets.BUNNY_STORAGE_HOST }}
          BUNNY_STORAGE_USERNAME: ${{ secrets.BUNNY_STORAGE_USERNAME }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          apt-get update -y
          apt-get install -y lftp
          lftp -u "${BUNNY_STORAGE_USERNAME},${BUNNY_STORAGE_PASSWORD}" \
            "sftp://${BUNNY_STORAGE_HOST}" \
            -e "set sftp:auto-confirm yes; mirror -R --delete --verbose output/ /; quit"

      - name: Purge CDN cache
        run: |
          curl -sf -X POST \
            "https://api.bunny.net/pullzone/${{ secrets.BUNNY_PULLZONE_ID }}/purgeCache" \
            -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
            -H "Content-Length: 0"
