[package]
name = "blakerain-com"
version = "3.0.0"
authors = ["Blake Rain <blake.rain@blakerain.com>"]
edition = "2024"
rust-version = "1.93"

[dependencies]
anyhow = { version = "1.0" }
base64 = { version = "0.23" }
clap = { version = "4.6", features = ["derive", "env"] }
image = { version = "0.25" }
libc = { version = "0.2" }
minify-html = { version = "0.18" }
pulldown-cmark = { version = "0.13" }
nom = { version = "8.0" }
pulldown-cmark-escape = { version = "0.11" }
regex = { version = "1.13" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha2 = { version = "0.11" }
thiserror = { version = "2.0" }
notify-debouncer-full = { version = "0.7" }
poem = { version = "3", features = ["static-files", "websocket"] }
futures-util = { version = "0.3" }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["full"] }
toml = { version = "1.0", features = ["parse"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["std", "env-filter", "tracing-log"] }
two-face = { version = "0.5.2", features = ["syntect-default-onig"] }
url = { version = "2.5" }
walkdir = { version = "2.5" }
webp = { version = "0.3" }
yaml-rust = { version = "0.4" }

poem-route-macro = { version = "0.1.1", registry = "blakerain" }

[dependencies.minijinja]
version = "2.24"
features = [
  "json",
  "loader",
  "speedups",
  "unicode",
  "urlencode"
]

[build-dependencies]
cc = { version = "1.4" }
